<!DOCTYPE html>
<html lang="es-CL">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Woowfy: bolsas sorpresa de locales cerca de ti a mitad de precio. Ahorra y evita el desperdicio de comida.">
  <meta name="theme-color" content="#063B25">

  <!-- iOS: permite "Agregar a pantalla de inicio" como app (PWA) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Woowfy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Woowfy · Rescata comida y ahorra</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Instalación como app (PWA): guardamos el evento del navegador para ofrecerlo desde la pantalla Cuenta.
    (function () {
      let deferred = null;
      addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
      addEventListener('appinstalled', function () { deferred = null; });
      window.woowfyPwa = {
        canPrompt: function () { return deferred !== null; },
        isInstalled: function () {
          return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        },
        isIos: function () { return /iphone|ipad|ipod/i.test(navigator.userAgent); },
        prompt: async function () {
          if (!deferred) return false;
          deferred.prompt();
          const choice = await deferred.userChoice;
          deferred = null;
          return choice.outcome === 'accepted';
        },
      };
    })();

    // Escáner QR en iPhone: Safari solo muestra el video de la cámara dentro de la página si el <video> tiene
    // "playsinline" (y sin sonido). mobile_scanner no lo pone, y sin él el visor queda en negro.
    (function () {
      const play = HTMLMediaElement.prototype.play;
      HTMLMediaElement.prototype.play = function () {
        if (this instanceof HTMLVideoElement) {
          this.playsInline = true;
          this.setAttribute('playsinline', '');
          this.muted = true;
        }
        return play.apply(this, arguments);
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

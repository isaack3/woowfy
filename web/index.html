<!DOCTYPE html>
<html lang="es-CL">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Woowfy: bolsas sorpresa de locales cerca de ti a mitad de precio. Ahorra y evita el desperdicio de comida.">
  <meta name="theme-color" content="#063B25">

  <!-- iOS: permite "Agregar a pantalla de inicio" como app (PWA) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Woowfy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Woowfy · Rescata comida y ahorra</title>
  <link rel="manifest" href="manifest.json">
  <!-- Pantalla de carga: se ve mientras baja Flutter (con 3G pueden ser varios segundos) y se quita en su primer cuadro. -->
  <style>
    html, body { background: #FFF7E3; margin: 0; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: #FFF7E3; color: #063B25; font: 700 16px/1.4 Lato, system-ui, sans-serif; z-index: 1;
      transition: opacity .25s ease; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
    #splash .dots { display: flex; gap: 6px; }
    #splash .dots i { width: 8px; height: 8px; border-radius: 50%; background: #9BE52C; animation: wsp 1.2s ease-in-out infinite; }
    #splash .dots i:nth-child(2) { animation-delay: .15s; }
    #splash .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes wsp { 50% { transform: translateY(-6px); opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { #splash .dots i { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Cargando Woowfy…</span>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <script>
    addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script>
    // Instalación como app (PWA): guardamos el evento del navegador para ofrecerlo desde la pantalla Cuenta.
    (function () {
      let deferred = null;
      addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
      addEventListener('appinstalled', function () { deferred = null; });
      window.woowfyPwa = {
        canPrompt: function () { return deferred !== null; },
        isInstalled: function () {
          return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        },
        isIos: function () { return /iphone|ipad|ipod/i.test(navigator.userAgent); },
        prompt: async function () {
          if (!deferred) return false;
          deferred.prompt();
          const choice = await deferred.userChoice;
          deferred = null;
          return choice.outcome === 'accepted';
        },
      };
    })();
  </script>
  <!-- Escáner de QR propio para la web (funciona en Safari de iPhone). Ver web/qr_scanner.js. -->
  <script src="qr_scanner.js?v=3"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
